        C 390,505 399,496 410,492
        C 423,488 435,492 443,497
        C 451,492 461,489 472,490
        C 465,469 460,444 466,430
        Z" />
    </mask>
  </defs>
  <rect width="1122" height="1402" fill="white" mask="url(#unprinted-liquid)" />
